name: Docker build

# Checks that the server image still builds for both platforms, without
# pushing it.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/api/**
      - packages/bose-api-speaker-client/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - tsconfig.json
      - .dockerignore
      - .github/workflows/docker-build.yml
      - .github/workflows/docker-publish.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=revive-st-api
          cache-to: type=gha,scope=revive-st-api,mode=max
