name: Docker publish

# Publishes the server image for a released `@revive-st/api` version. The
# release workflow calls it: the tags Changesets pushes with `GITHUB_TOKEN`
# don't trigger other workflows.
on:
  workflow_call:
    inputs:
      version:
        description: Released version of @revive-st/api, e.g. 1.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released version of @revive-st/api, e.g. 1.2.0
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v6
        with:
          ref: "@revive-st/api@${{ inputs.version }}"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pradel/revive-st-api:${{ inputs.version }}
            ghcr.io/pradel/revive-st-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=revive-st-api
          cache-to: type=gha,scope=revive-st-api,mode=max
