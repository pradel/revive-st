name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: vite-plus setup
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "26"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
