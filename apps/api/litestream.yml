# Litestream runs beside the server (`start.sh`) and ships the database to
# S3-compatible storage. Tuned so that it costs little and lets an idle server
# sleep (Railway sleeps a service after 5 minutes without outbound traffic):
# - It reads new writes every minute and uploads them every minute, so a
#   crash loses about the last 2 minutes, and uploads stay at a few a minute
#   however busy the server is (every second by default: one upload a second).
#   Its first read comes a minute after start, so it logs `timeout waiting for
#   db initialization` at start; merges and snapshots still run afterwards.
# - It merges the uploaded changes every 15 minutes (30 seconds by default),
#   and deletes merged ones every hour (every 15 seconds by default): each
#   lists the bucket, so after the last write it goes quiet for 15 minutes.
l0-retention-check-interval: 1h
levels:
  - interval: 15m
  - interval: 1h
  - interval: 24h
snapshot:
  # A full snapshot every day (the default), kept 30 days.
  retention: 720h
dbs:
  - path: ${DATABASE_PATH}
    monitor-interval: 1m
    replica:
      type: s3
      bucket: ${S3_BUCKET}
      path: litestream
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      force-path-style: true
      access-key-id: ${S3_ACCESS_KEY_ID}
      secret-access-key: ${S3_SECRET_ACCESS_KEY}
      sync-interval: 1m
