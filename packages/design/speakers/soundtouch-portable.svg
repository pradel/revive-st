<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 66" width="96" height="66">
  <title>SoundTouch Portable</title>
  <!-- Front view, 10 units per inch. Black finish. Source: packages/design/speakers. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCDCE0"/>
      <stop offset="1" stop-color="#A2A2A8"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F2F4"/>
      <stop offset="0.5" stop-color="#9A9AA0"/>
      <stop offset="1" stop-color="#DADADE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E33"/>
      <stop offset="0.35" stop-color="#121214"/>
      <stop offset="1" stop-color="#0B0B0C"/>
    </linearGradient>
    <pattern id="grille" width="2.4" height="2.4" patternUnits="userSpaceOnUse">
      <rect width="2.4" height="2.4" fill="#1A1A1D"/>
      <circle cx="1.2" cy="1.2" r="0.5" fill="#232327"/>
    </pattern>
  </defs>
  <!-- Keypad tray on top -->
  <rect x="30.72" y="1" width="34.56" height="6" rx="3" fill="#8E8E94"/>
  <rect x="32.72" y="2" width="30.56" height="2.6" rx="1.3" fill="#C8C8CD"/>
  <!-- Silver wrap and grille face -->
  <rect x="0" y="4" width="96" height="62" rx="9" fill="url(#shell)"/>
  <rect x="3" y="7" width="90" height="56" rx="7" fill="url(#grille)"/>
  <rect x="3" y="7" width="90" height="56" rx="7" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="0.8"/>
  <!-- Glass display panel: lit display, wordmark, chrome foot -->
  <rect x="38" y="14.28" width="20" height="40.32" rx="2.5" fill="url(#glass)" stroke="#3A3A3F" stroke-width="0.5"/>
  <rect x="43" y="20.28" width="10" height="1.6" rx="0.8" fill="#2EDCA0"/>
  <circle cx="48" cy="31.21" r="1.1" fill="#6E6E74"/>
  <rect x="42" y="45.6" width="12" height="2" rx="1" fill="#9A9AA0"/>
  <rect x="39" y="50.6" width="18" height="1.2" rx="0.6" fill="url(#chrome)"/>
</svg>
