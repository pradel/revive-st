packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
  react-native-wifi-reborn@4.13.6: patches/react-native-wifi-reborn@4.13.6.patch
