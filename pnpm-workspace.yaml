packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  sharp: false
  workerd: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
  expo-modules-jsi@58.0.21: patches/expo-modules-jsi@58.0.21.patch
  react-native-wifi-reborn@4.13.6: patches/react-native-wifi-reborn@4.13.6.patch
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.18"
  - "@expo/config@58.0.10"
  - "@expo/fingerprint@0.21.8"
  - "@expo/local-build-cache-provider@58.0.10"
  - "@expo/log-box@58.0.14"
  - "@expo/metro-config@58.0.20"
  - "@expo/prebuild-config@58.0.18"
  - "@expo/router-server@58.0.20"
  - "@expo/schema-utils@58.0.3"
  - babel-preset-expo@58.0.23
  - expo-modules-core@58.0.29
  - expo@58.0.22
  - "@expo/metro-runtime@58.0.16"
  - "@expo/ui@58.0.26"
  - expo-build-properties@58.0.12
  - expo-dev-client@58.0.18
  - expo-dev-launcher@58.0.18
  - expo-router@58.0.29
